[package]
name = "tenferro-cpu-tprims"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>"]
publish = false
description = "Optional tprims-backed GEMM and dot_general providers for tenferro-cpu."

[workspace]
resolver = "2"

[lib]
name = "tenferro_cpu_tprims"
path = "src/lib.rs"

[dependencies]
tenferro-cpu = { path = "../../crates/tenferro-cpu", default-features = false, features = ["cpu-faer"] }
tenferro-tensor = { path = "../../crates/tenferro-tensor", default-features = false }
num-complex = "0.4"
# tensor4all/tprims-rs main after PR #21 (grouped GEMM); bump deliberately.
tprims-exec = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "d8e565a9c16c35ec98b45ec99bd7046db194bb33" }
tprims-blas = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "d8e565a9c16c35ec98b45ec99bd7046db194bb33" }
tprims-contract = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "d8e565a9c16c35ec98b45ec99bd7046db194bb33" }
# Held at the strided-rs revision the tprims-rs commit above uses, so this
# bridge and tprims share one `StridedView`. That tprims commit predates the
# crate rename, so this workspace resolves strided-rs twice: 0.4.4 here and for
# tprims, 0.4.5 through the tenferro-* path dependencies. It builds and tests in
# that state, and moving to one revision is the tprims migration tracked in
# https://github.com/tensor4all/tenferro-rs/issues/1988.
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "25705339d45583f5eb77bdbde22f2349b48e3f95", version = "0.4.4" }

# Match workspace [profile.ci] used by scripts/ci/run_profile.py extensions.
[profile.ci]
inherits = "test"
debug = 0
incremental = false
strip = "symbols"
