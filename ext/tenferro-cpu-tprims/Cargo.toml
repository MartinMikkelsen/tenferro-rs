[package]
name = "tenferro-cpu-tprims"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>"]
publish = false
description = "Optional tprims-backed GEMM and dot_general providers for tenferro-cpu."

[workspace]
resolver = "2"

[lib]
name = "tenferro_cpu_tprims"
path = "src/lib.rs"

[dependencies]
tenferro-cpu = { path = "../../crates/tenferro-cpu", default-features = false, features = ["cpu-faer"] }
tenferro-tensor = { path = "../../crates/tenferro-tensor", default-features = false }
num-complex = "0.4"
# tensor4all/tprims-rs main after the October 2026 source integration (#37); bump deliberately.
tprims-exec = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "36bad5202cbd9d36642954639a370fda9b891739" }
tprims-contract = { git = "https://github.com/tensor4all/tprims-rs.git", rev = "36bad5202cbd9d36642954639a370fda9b891739" }
# Spelled exactly as tenferro's workspace pin so both resolve one strided-rs
# source and share `StridedView`.
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "0a94a7a57f13179136dda5b384eb97895a4b3527", version = "0.4.4" }

[dev-dependencies]
tenferro-ad = { path = "../../crates/tenferro-ad", default-features = false, features = ["cpu-faer"] }
tenferro-linalg = { path = "../../crates/tenferro-linalg", default-features = false, features = ["cpu-faer", "autodiff"] }
rayon = "1"

# Match workspace [profile.ci] used by scripts/ci/run_profile.py extensions.
[profile.ci]
inherits = "test"
debug = 0
incremental = false
strip = "symbols"
